# GitHub Pages: publishes site/ at the root of the address, with the images it loads from assets/ and
# docs/screenshots/ (tools/release/stage_site.py). Dormant until the maintainer sets the repository variable
# PAGES_ENABLED to "true" (Settings, Secrets and variables, Actions, Variables) and Settings, Pages, Source to
# "GitHub Actions"; without the variable the jobs are skipped. (After
# Project Pyrrhus's pages.yml, MIT.)
name: pages
on:
  push:
    branches: [main]
    paths: ["site/**", "assets/**", "docs/screenshots/**", "tools/release/stage_site.py", "tools/release/check_site.py",
            ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: The page is what its sources give (tools/website.py)
        run: python3 tools/website.py --check
      - name: Stage _site/ (tools/release/stage_site.py)
        # site/ is the root of the published address; site/ there only sends the old address on to it.
        run: python3 tools/release/stage_site.py _site
      - name: The staged site is whole (tools/release/check_site.py)
        run: python3 tools/release/check_site.py --staged _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
