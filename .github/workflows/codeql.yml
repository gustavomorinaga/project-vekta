# CodeQL code scanning: the Python tools, the port's C and C++ (without a build: the lifted code needs the player's
# game), and the workflows. Pushes and pull requests that change only docs, the site or images skip it; the weekly
# run covers the whole tree. (After Project Helghast's codeql.yml, MIT.)
name: CodeQL
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "site/**", "assets/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "site/**", "assets/**", "**/*.md"]
  schedule:
    - cron: "41 5 * * 1"
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, c-cpp, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: /language:${{ matrix.language }}
