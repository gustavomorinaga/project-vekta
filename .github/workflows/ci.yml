# CI without the game (the layout follows Project Helghast and Project Pyrrhus, by undecuple, MIT). The program cannot
# be built here: the translated code comes from the player's own EBOOT and is never committed. So this checks what can
# be checked without game data: that every patch applies to the pinned ps3recomp, that the tree holds no game files,
# personal paths, keys or untranslated text, lint, the host tests (tools/host-tests.txt), and a secret scan of the
# whole history.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Patches apply to the pinned ps3recomp
        run: bash tools/ps3recomp-patched.sh
      - name: No game files, personal paths, keys or untranslated text
        run: sh tools/check-tree.sh
      - name: Scripts parse
        run: |
          set -e
          for f in tools/*.sh; do if head -1 "$f" | grep -q bash; then bash -n "$f"; else sh -n "$f"; fi; done
          python3 -m py_compile tools/*.py
          python3 -c "import json; json.load(open('.recomp.json'))"
      - name: Lint (shellcheck at warning level, ruff with ruff.toml)
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet --disable-pip-version-check ruff==0.16.9 shellcheck-py==0.11.0.1
          PATH="$RUNNER_TEMP/lint/bin:$PATH" RUFF_FORMAT=github bash tools/lint.sh
      - name: bubblewrap for the sandbox test, SDL2 for ps3recomp's own tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap libsdl2-dev >/dev/null
          # Ubuntu's AppArmor blocks unprivileged user namespaces, which bwrap needs; this runner is thrown away after
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Host tests (no game data; the list is tools/host-tests.txt)
        run: bash tools/run-host-tests.sh --gh

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No co-author trailers in new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # the commits this push or pull request adds; a new branch (no before) checks only its head
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then range="HEAD^!"; else range="$BASE..HEAD"; fi
          if git log --format='%H%n%B' "$range" | grep -i '^co-authored-by:'; then
            echo "::error::a commit carries a Co-Authored-By trailer (AGENTS.md, Commits and pull requests)"; exit 1
          fi
      - name: Gitleaks (full history; config in .gitleaks.toml)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz
          echo "cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
