# CI without the game (the layout follows Project Helghast and Project Pyrrhus, by undecuple, MIT). The program cannot
# be built here: the translated code comes from the player's own EBOOT and is never committed. So this checks what can
# be checked without game data: that every patch applies to the pinned ps3recomp, that the tree holds no game files,
# personal paths, keys or untranslated text, lint, the host tests (tools/host-tests.txt), and a secret scan of the
# whole history.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Patches apply to the pinned ps3recomp
        run: bash tools/ps3recomp-patched.sh
      - name: No game files, personal paths, keys or untranslated text
        run: sh tools/check-tree.sh
      - name: Scripts parse
        run: |
          set -e
          for f in tools/*.sh; do if head -1 "$f" | grep -q bash; then bash -n "$f"; else sh -n "$f"; fi; done
          python3 -m py_compile tools/*.py tools/release/*.py
          python3 -c "import json; json.load(open('.recomp.json'))"
      - name: Lint (shellcheck at warning level, ruff with ruff.toml)
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet --disable-pip-version-check ruff==0.16.9 shellcheck-py==0.11.0.1
          PATH="$RUNNER_TEMP/lint/bin:$PATH" RUFF_FORMAT=github bash tools/lint.sh
      - name: bubblewrap for the sandbox test, SDL2 for ps3recomp's own tests, qemu-user for the CPU check's test
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap libsdl2-dev qemu-user >/dev/null
          # Ubuntu's AppArmor blocks unprivileged user namespaces, which bwrap needs; this runner is thrown away after
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: The pinned Zig, which builds the CPU check's static baseline program for the emulated Nehalem
        run: python3 tools/release/fetch_toolchain.py --only zig --cache "$RUNNER_TEMP/toolchain-cache"
      - name: Host tests (no game data; the list is tools/host-tests.txt)
        env:
          KZ_REQUIRE_QEMU: "1"   # tools/tests/test_cpu_check.sh: the run on an emulated Nehalem must happen here
          KZ_ZIG: ${{ runner.temp }}/toolchain-cache/zig/zig
        run: bash tools/run-host-tests.sh --gh

  windows-host:
    # The host tests that also build for Windows, cross-built with the pinned llvm-mingw and run under Wine
    # (tools/wine-host-tests.sh): the runtime's Windows code paths, still with no game, no GPU and no Windows machine.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - name: Patches apply to the pinned ps3recomp
        run: bash tools/ps3recomp-patched.sh
      - name: Wine
        # Twice on 2026-11-18 this step sat silent until the job's 20 minutes ran out (two runner images; the same
        # step took 25 s in the runs before and after). Each apt call now has its own time limit, apt's network
        # retries and lock wait are bounded, a stuck attempt is tried again, and a failed one shows apt's last lines.
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o DPkg::Lock::Timeout=120)
          log="$RUNNER_TEMP/apt-wine.log"
          for try in 1 2 3; do
            if timeout 150 sudo -E apt-get "${apt_opts[@]}" update -qq >"$log" 2>&1 &&
               timeout 300 sudo -E apt-get "${apt_opts[@]}" install -y -qq --no-install-recommends wine64 >>"$log" 2>&1; then
              dpkg-query -W wine64
              exit 0
            fi
            echo "::warning::apt attempt $try for Wine failed or timed out; its last lines:"
            tail -n 20 "$log"
            sleep 10
          done
          exit 1
      - name: Windows host tests under Wine (the toolchain from tools/release/toolchain.json, SHA-256 checked)
        run: bash tools/wine-host-tests.sh

  release-tools-windows:
    # The release tools' Python tests on a real Windows (paths, drive letters, os.name == "nt" branches), listed in
    # tools/host-tests-windows.txt. After Project Helghast's release-tools-windows job (undecuple, MIT).
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Line endings as committed
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Release tools' tests (every one runs; the step names the failed ones)
        run: |
          failed=""
          while read -r t; do
            case "$t" in ''|'#'*) continue ;; esac
            echo "== $t"
            python "$t" || failed="$failed $t"
          done < tools/host-tests-windows.txt
          if [ -n "$failed" ]; then echo "failed:$failed"; exit 1; fi

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No co-author trailers in new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # the commits this push or pull request adds; a new branch (no before) checks only its head
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then range="HEAD^!"; else range="$BASE..HEAD"; fi
          bash tools/check-coauthors.sh "$range"   # Dependabot's own squash trailer passes, nothing else
      - name: Gitleaks (full history; config in .gitleaks.toml)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz
          echo "cb49b7de5ee986510fe8666ca0273a6cc15eb82571f2f14832c9e8920751f3a4  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
