# Read-only check of a published release: fails when the release and the repository at its tag disagree. After
# Project Pyrrhus's and Project Helghast's release-check.yml (undecuple, MIT).
#
# Triggers: a published release (the maintainer publishes the draft release.yml made), and workflow_dispatch (input:
# tag). Nothing is written: no release edit, no push, no tag, no artefact (the log is the output); the token can only
# read. Checks (tools/release/release_check.py, host-tested by tools/tests/test_release_check.py): tag = v + VERSION at
# the tagged commit; published, pre-release while 0.x, title = tag, body names the version; the assets are exactly
# project-vekta-<version>-source.tar.gz, its .sha256 and SHA256SUMS; the sums match the files; README.md and
# site/index.html link releases/tag/<tag>; the version mentions at the tag agree (test_version_agree.py).
# Third-party: actions/checkout (GitHub, MIT), the gh CLI (MIT, on the image).
name: release-check

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to check (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read    # the release, its assets and the tagged tree are read; nothing is written
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Tag shape
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1 ;;
          esac
          case "$TAG" in *[!0-9v.]*) echo "::error::tag '$TAG' has odd characters"; exit 1 ;; esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - name: Release JSON
        run: gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"

      - name: Download the assets
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/assets"
          ls -l "$RUNNER_TEMP/assets"

      - name: sha256sum -c SHA256SUMS
        run: cd "$RUNNER_TEMP/assets" && sha256sum -c SHA256SUMS

      - name: Release against the repository (tag, pre-release, assets, hashes, README and site links)
        run: |
          python3 tools/release/release_check.py --tag "$TAG" --release "$RUNNER_TEMP/release.json" \
            --assets "$RUNNER_TEMP/assets" --root .

      - name: Version mentions at the tag
        run: python3 tools/tests/test_version_agree.py
