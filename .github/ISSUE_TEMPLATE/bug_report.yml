name: Bug report
description: Something in the port does not work as it should
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. Please do **not** attach game files, decrypted binaries, saves or keys: only logs and screenshots. Check [docs/KNOWN_ISSUES.md](https://github.com/gustavomorinaga/project-vekta/blob/main/docs/KNOWN_ISSUES.md) first.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order.
  - type: input
    id: version
    attributes:
      label: Port build
      description: "The commit you built (`git rev-parse --short HEAD`), and whether `tools/check-game-files.py` said ok for every file."
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: ["Linux (native build)", "Windows (cross-built exe)", "Wine or Proton on Linux"]
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: "OS (distribution, Windows version or Proton version), CPU, GPU and driver version."
    validations:
      required: true
  - type: input
    id: settings
    attributes:
      label: Settings
      description: "Frame-rate limit (30, 60, 144) and anything changed on the PC page or by environment variables."
  - type: input
    id: level
    attributes:
      label: Level or menu
      description: "Which level or menu, and how long after the start."
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: "Attach the log (`work/play.log`, or `kz1hd.log` beside the Windows exe). Before attaching, remove your user name, home folder paths and host name. Never attach game files, decrypted binaries, saves or keys."
