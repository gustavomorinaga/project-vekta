name: Bug report
description: Something in the port does not work as it should
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing. Check [docs/KNOWN_ISSUES.md](https://github.com/gustavomorinaga/project-vekta/blob/main/docs/KNOWN_ISSUES.md) first. Never attach game files, decrypted binaries, saves or keys: the support package below holds none of them.
  - type: textarea
    id: package
    attributes:
      label: Support package
      description: "Drag the support package here (`project-vekta-support-*.zip`). The launcher offers to make it when the game closes unexpectedly; otherwise: the Windows Start menu's \"Make a support package\", `scripts\\support.cmd` (Windows zip), `scripts/support.sh` or `./project-vekta --support-package` (Linux). It holds the logs, the crash reports and the settings, with your user folder written as `~`, and nothing is sent until you submit this form. [What it contains](https://github.com/gustavomorinaga/project-vekta/blob/main/docs/TROUBLESHOOTING.md#where-the-logs-are)."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order.
  - type: input
    id: version
    attributes:
      label: Port build
      description: "The version, for example 0.7.0: the first line of `work/play.log`, or \"Port version\" in the package's facts.txt. From source: the commit too (`git rev-parse --short HEAD`)."
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it
      options: ["Setup program (Windows)", "Windows zip", "Linux folder", "RecompLauncher", "Quiver Launcher", "From source (Git)"]
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: ["Windows", "Linux", "Wine or Proton on Linux"]
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: "OS (distribution, Windows version or Proton version), CPU, GPU and driver version."
    validations:
      required: true
  - type: input
    id: settings
    attributes:
      label: Settings
      description: "Frame-rate limit (30, 60, 144) and anything changed on the PC page or by environment variables."
  - type: input
    id: level
    attributes:
      label: Level or menu
      description: "Which level or menu, and how long after the start."
  - type: textarea
    id: logs
    attributes:
      label: Log
      description: "How the session ended and the crash signature (the launcher fills these in). Without a support package, attach `work/play.log`: the launcher writes your home folder as `~` in it. Never attach game files, decrypted binaries, saves or keys."
