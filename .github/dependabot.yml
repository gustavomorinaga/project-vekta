# Dependabot: GitHub Actions versions (weekly), plus security updates. The ps3recomp submodule is pinned on purpose
# (the patches in port/patches are made against that release) and is updated by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
